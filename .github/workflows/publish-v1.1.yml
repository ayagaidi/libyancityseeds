name: Publish v1.1.0

on:
  push:
    branches: [master]
    paths:
      - 'docs/releases/v1.1.0.md'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 already exists; nothing to publish."
            exit 0
          fi

          gh release create v1.1.0 \
            --target "$GITHUB_SHA" \
            --title "Libya Locations v1.1.0" \
            --notes-file docs/releases/v1.1.0.md
